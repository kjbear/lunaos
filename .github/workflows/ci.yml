name: CI

on:
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate Branch Name
    runs-on: ubuntu-latest
    steps:
      - name: Check branch format
        run: |
          BRANCH="${{ github.head_ref }}"
          if [[ ! "$BRANCH" =~ ^(dave|maya|sam|chen|alex|jordan|leo)/(feature|fix|refactor|test|docs|chore)-.+ ]]; then
            echo "❌ Invalid branch name: $BRANCH"
            echo ""
            echo "Branch must be: <agent>/<type>-<description>"
            echo ""
            echo "Valid agents: dave, maya, sam, chen, alex, jordan, leo"
            echo "Valid types: feature, fix, refactor, test, docs, chore"
            echo ""
            echo "Examples:"
            echo "  dave/feature-projects-api"
            echo "  maya/fix-task-board"
            echo "  sam/test-auth-flow"
            exit 1
          fi
          echo "✅ Branch name valid: $BRANCH"

  lint:
    name: Lint & Static Analysis
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, sqlite, pdo_sqlite, bcmath, ctype, json, tokenizer
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run Pint (code style)
        run: vendor/bin/pint --test --dirty

      # PHPStan temporarily disabled - install with: composer require --dev phpstan/phpstan
      # - name: Run PHPStan (static analysis)
      #   run: vendor/bin/phpstan analyse --memory-limit=512M

      - name: Check for debug statements
        run: |
          if grep -rq "dd(" app/ --include="*.php"; then
            echo "❌ Found dd() statements in app/"
            exit 1
          fi
          if grep -rq "dump(" app/ --include="*.php"; then
            echo "❌ Found dump() statements in app/"
            exit 1
          fi
          if grep -rq "ray(" app/ --include="*.php"; then
            echo "❌ Found ray() statements in app/"
            exit 1
          fi
          echo "✅ No debug statements found"

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, sqlite, pdo_sqlite, bcmath, ctype, json, tokenizer
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Setup environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run migrations
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"
        run: php artisan migrate --force

      - name: Run tests
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"
        run: php artisan test